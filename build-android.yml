name: Build Android APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verificar Android SDK preinstalado
        run: |
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platform-tools"
          echo "Android SDK disponible en: $ANDROID_HOME"

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Crear proyecto Android y sincronizar
        run: |
          npx cap add android
          npx cap sync android

      - name: Preparar herramienta de iconos
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Aplicar iconos originales de Nilo
        run: python scripts/apply-android-icons.py

      - name: Comprobar JavaScript
        run: npm test

      - name: Compilar APK de prueba
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: mi-control-financiero-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
